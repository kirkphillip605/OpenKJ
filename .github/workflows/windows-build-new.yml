name: Windows Builds

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    name: Windows x64 Build
    runs-on: windows-2022 # Updated to 2022 for MSVC v143 & C++17 support

    env:
      GST_VERSION: '1.27.2' # Centralized variable for easy updates

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get version from git tag
      id: get_version
      uses: battila7/get-version-action@v2

    - name: Setup OpenKJ version env vars
      shell: bash
      run: |
        BRANCH=${GITHUB_REF##*/}
        RTYPE="release"
        OKJVER=${{ steps.get_version.outputs.version-without-v }}

        FN="OpenKJ-${OKJVER}-64bit-setup.exe"
        echo "branch=${BRANCH}" >> $GITHUB_ENV
        echo "rtype=${RTYPE}" >> $GITHUB_ENV
        echo "okjver=${OKJVER}" >> $GITHUB_ENV
        echo "installer_fn=${FN}" >> $GITHUB_ENV
        echo "OpenKJ Version: $OKJVER"
        echo "Installer Filename: $FN"

    - name: Update files with new version info
      if: steps.get_version.outputs.is-semver == 'true'
      shell: bash
      run: |
        echo "Updating okjversion.h"
        echo "#ifndef OKJVERSION_H" > src/okjversion.h
        echo "#define OKJVERSION_H" >> src/okjversion.h
        echo "" >> src/okjversion.h
        echo "#define OKJ_VERSION_MAJOR ${{ steps.get_version.outputs.major }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_MINOR ${{ steps.get_version.outputs.minor }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_BUILD ${{ steps.get_version.outputs.patch }}" >> src/okjversion.h
        echo "#define OKJ_VERSION_STRING \"${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}.${{ steps.get_version.outputs.patch }}\"" >> src/okjversion.h
        echo "#define OKJ_VERSION_BRANCH \"${{ env.rtype }}\"" >> src/okjversion.h
        echo "" >> src/okjversion.h
        echo "#endif //OKJVERSION_H" >> src/okjversion.h

        echo "Updating installer config file"
        sed -i "s/#define MyAppVersion.*/#define MyAppVersion \"${{ steps.get_version.outputs.version-without-v }}\"/" cd/openkj64.iss

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1 # Puts 'signtool' and MSVC compilers into the PATH

    - name: Install TagLib via vcpkg
      run: |
        vcpkg integrate install
        vcpkg install taglib:x64-windows pkgconf:x64-windows

    - name: Download & Install GStreamer Runtime
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/${{ env.GST_VERSION }}/msvc/gstreamer-1.0-msvc-x86_64-${{ env.GST_VERSION }}.msi" -OutFile "gstreamer.msi"
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i gstreamer.msi /quiet ADDLOCAL=ALL" -Wait -NoNewWindow

    - name: Download & Install GStreamer Dev
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/${{ env.GST_VERSION }}/msvc/gstreamer-1.0-devel-msvc-x86_64-${{ env.GST_VERSION }}.msi" -OutFile "gstreamer-devel.msi"
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i gstreamer-devel.msi /quiet ADDLOCAL=ALL" -Wait -NoNewWindow

    - name: Make dist copy of gstreamer
      shell: bash
      run: cp -Rv c:/gstreamer ./gstreamer-dist

    - name: Download Output Dependencies (Fonts & Utils)
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path downloads
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/unzip.exe' -OutFile 'downloads\unzip.exe'
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/ssl-x86_64-1.1.1.zip' -OutFile 'downloads\openssl.zip'
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/Roboto-Bold.ttf' -OutFile 'downloads\Roboto-Bold.ttf'
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/Roboto-Medium.ttf' -OutFile 'downloads\Roboto-Medium.ttf'
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/Roboto-Regular.ttf' -OutFile 'downloads\Roboto-Regular.ttf'
        Invoke-WebRequest -Uri 'https://storage.googleapis.com/okj-installer-deps/SourceCodePro-Medium.ttf' -OutFile 'downloads\SourceCodePro-Medium.ttf'

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.10.2' # Note: adjust to exactly match your preferred Qt 6 version
        arch: 'win64_msvc2022_64'
        modules: 'qtbase qtsvg'

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      working-directory: ${{github.workspace}}/build
      shell: cmd
      # We use vcpkg.cmake to find TagLib, and explicitly set Qt6_DIR so vcpkg doesn't override it.
      run: |
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" -DQt6_DIR="%Qt6_DIR%"

    - name: Build C++ Source
      working-directory: ${{github.workspace}}/build
      shell: cmd
      run: cmake --build . --parallel

    - name: Stage Output Directory
      shell: cmd
      run: |
        mkdir output
        copy build\openkj.exe output\

    - name: Run windeployqt
      shell: cmd
      run: windeployqt --release --compiler-runtime output\openkj.exe

    - name: Copy in GStreamer & Other Dependencies
      shell: bash
      run: |
        cp -Rv ./gstreamer-dist/1.0/x86_64/* output/
        cp -v ./gstreamer-dist/1.0/x86_64/bin/*.dll output/
        cp LICENSE output/LICENSE.txt
        cp downloads/unzip.exe output/
        cp downloads/*.ttf output/
        7z e -bb3 -y downloads/openssl.zip -o"output/"

    - name: Generate Self-Signed Code Certificate
      shell: powershell
      run: |
        # Creates a local code signing cert valid for 1 year
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=OpenKJ Self Signed" -CertStoreLocation Cert:\CurrentUser\My
        $certPassword = ConvertTo-SecureString -String "openkj" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "cscrt.pfx" -Password $certPassword

    - name: Sign OpenKJ Executable
      shell: cmd
      run: |
        signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /f cscrt.pfx /p "openkj" output\openkj.exe

    - name: Create InnoSetup Installer
      shell: cmd
      run: |
        copy cd\openkj64.iss inst.iss
        mkdir installer
        "%programfiles(x86)%\Inno Setup 6\iscc.exe" inst.iss /Oinstaller\

    - name: Sign & Rename Installer
      shell: cmd
      run: |
        signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /f cscrt.pfx /p "openkj" installer\OpenKJ.exe
        mkdir installer\%branch%
        move installer\OpenKJ.exe installer\%branch%\%installer_fn%

    - name: Upload Installer to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenKJ-Win64-Installer
        path: installer/${{ env.branch }}/${{ env.installer_fn }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.get_version.outputs.is-semver == 'true'
      with:
        files: installer/${{ env.branch }}/${{ env.installer_fn }}
        prerelease: ${{ env.rtype != 'release' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    # Note: Keep your GCP upload step here if you have the GCP secrets configured in your repository settings!
